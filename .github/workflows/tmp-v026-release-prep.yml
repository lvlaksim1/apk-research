name: Temporary v0.26 release prep

on:
  push:
    branches:
      - feature/v0.26-investigator-workspace
    paths:
      - .github/workflows/tmp-v026-release-prep.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Prepend v0.26 release sections
        run: |
          python - <<'PY'
          from pathlib import Path

          sections = {
              "README.md": '''## v0.26.0 — Investigator Workspace

          v0.26.0 превращает существующие Session Evidence, Evidence Explorer и Packet Inspector в единое рабочее место исследователя. Новый раздел `Investigator` даёт глобальный поиск и пересекающиеся фильтры по времени, типу события, протоколу, процессу/PID/inode, endpoint, action и классу связи.

          Каждая строка получает воспроизводимую навигационную ссылку `EV-...`. На этих ссылках построены закладки, именованные наборы доказательств и отчёты Markdown/JSON с обратным переходом к исходной строке, Timeline, Evidence, Packets и экранному контексту. EV-ссылка и включение записи в отчёт не создают новый факт и не усиливают исходную связь.

          Пользовательское состояние хранится рядом с архивом в `<research.zip>.investigator.json`; сам Research ZIP не изменяется. RAW PCAP остаётся авторитетным, Action ↔ Flow/Packet — `temporal-only`, экранные ссылки — `time-aligned-navigation`, а протокольный анализ v0.25 — `captured-packets-only`. Подробный контракт: `docs/V0.26_INVESTIGATOR_WORKSPACE.md`.

          ''',
              "CHANGELOG.md": '''## [0.26.0] - 2026-10-07

          ### Investigator Workspace

          - Adds a dedicated Investigator workspace over the existing v0.24/v0.25 evidence model.
          - Adds global search and intersecting filters by time, event kind, protocol, process/PID/inode, endpoint, action and evidence class.
          - Adds reproducible `EV-...` navigation references derived from existing evidence identity without creating a new forensic fact.
          - Adds bookmarks and named evidence sets stored outside the immutable Research ZIP in `<research.zip>.investigator.json`.
          - Adds reverse navigation from workspace/evidence-set items to Session Evidence, Timeline, Evidence Explorer, Packet Inspector and screen context.
          - Adds Markdown/JSON report generation from the active evidence set; every report item retains EV/action/flow/time source-navigation identifiers.
          - Treats report membership as analyst selection rather than evidence and preserves original relation type/strength and `causal_claim`.
          - Preserves RAW PCAP authority, temporal-only action/network links, time-aligned screen navigation and capture-bounded protocol semantics.
          - Leaves hidden Emulator → gRPC/MMAP → AndroidView, v0.10.5 startup sequencing and the dual-source screen model unchanged.

          ''',
              "REFACTORING.md": '''## v0.26.0 — Investigator Workspace

          ### Scope boundary

          v0.26 is a workflow/presentation layer over the verified v0.24 Unified Session Evidence and v0.25 Transport/Protocol Analysis. It introduces no new capture path, no replacement RAW artifact and no stronger causal model.

          ### Stable navigation references

          Each workspace row receives a deterministic `EV-...` key derived from the row's existing time/event/action/flow identity. The key is used only for navigation, bookmarks, evidence sets and reports. It does not become source evidence and does not upgrade attribution or temporal correlation.

          ### Analyst-state boundary

          Bookmarks and named evidence sets are persisted beside the archive as `<research.zip>.investigator.json`. The immutable Research ZIP is never opened for write. Stale references are pruned against the current workspace model.

          ### Search/filter boundary

          Global search and filters are intersections over already observed/modelled fields. A filtered-out or absent row is not evidence that an event did not occur.

          ### Report boundary

          Markdown/JSON reports contain selected evidence references plus source navigation IDs. Report membership is explicit analyst selection. Every record retains its original relation type/strength and `causal_claim`; the report cannot strengthen the source relation.

          ### Compatibility boundary

          RAW PCAP remains authoritative; Action ↔ Flow/Packet stays temporal-only; screen links remain time-aligned navigation; v0.25 protocol interpretation remains captured-packets-only. Hidden Emulator → gRPC/MMAP → AndroidView, v0.10.5 startup/clean-launch sequencing and the accepted Continuous Screen + high-resolution screenrecord roles are unchanged. Audio Evidence and user-facing Virtual Display remain out of scope.

          ''',
          }

          for filename, section in sections.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              marker = section.splitlines()[0]
              if marker in text:
                  continue
              if text.startswith("# "):
                  first, rest = text.split("\n", 1)
                  text = first + "\n\n" + section + rest.lstrip("\n")
              else:
                  text = section + text
              path.write_text(text, encoding="utf-8")
          PY
      - name: Verify v0.26 focused contract
        run: |
          python -m compileall -q src
          pytest -q tests/test_investigator_workspace_v026.py
          python - <<'PY'
          from pathlib import Path
          import apk_research

          assert apk_research.__version__ == "0.26.0"
          for name in ("README.md", "CHANGELOG.md", "REFACTORING.md", "RELEASE_NOTES.md"):
              assert "0.26.0" in Path(name).read_text(encoding="utf-8"), name
          assert Path("docs/V0.26_INVESTIGATOR_WORKSPACE.md").is_file()
          PY
      - name: Commit verified release preparation and remove helper
        run: |
          rm .github/workflows/tmp-v026-release-prep.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md REFACTORING.md .github/workflows/tmp-v026-release-prep.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "v0.26: finalize release documentation"
          git push origin HEAD:feature/v0.26-investigator-workspace
