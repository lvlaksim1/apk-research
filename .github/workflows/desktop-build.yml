name: Desktop Build

on:
  push:
    paths:
      - "src/mobile_research/**"
      - "packaging/**"
      - "pyproject.toml"
      - "tests/**"
      - "tools/check_desktop_android_components.py"
      - ".github/workflows/desktop-build.yml"
      - ".github/workflows/windows-whpx-acceptance.yml"
  pull_request:
    paths:
      - "src/mobile_research/**"
      - "packaging/**"
      - "pyproject.toml"
      - "tests/**"
      - "tools/check_desktop_android_components.py"
      - ".github/workflows/desktop-build.yml"
      - ".github/workflows/windows-whpx-acceptance.yml"

permissions:
  contents: read

jobs:
  build-windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -e ".[dev,desktop,build]"

      - name: Run tests
        run: python -m pytest -q

      - name: Resolve live Android component catalog
        run: python tools/check_desktop_android_components.py

      - name: Build standalone desktop application
        run: python -m PyInstaller --noconfirm --clean packaging/MobileResearch.spec

      - name: Standalone self-test
        shell: pwsh
        run: |
          $exe = "dist\MobileResearch\MobileResearch.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Standalone self-test failed: $($process.ExitCode)" }

      - name: Standalone GUI smoke-test
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $exe = "dist\MobileResearch\MobileResearch.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--gui-smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Standalone GUI smoke-test failed: $($process.ExitCode)" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer | Out-Null
          $text = Get-Content pyproject.toml -Raw
          if ($text -notmatch '(?m)^version\s*=\s*"([^"]+)"') { throw "Version not found" }
          $version = $Matches[1]
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" packaging\mobile-research.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install built package and smoke-test installed app
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "MobileResearchInstalled"
          $installer = (Resolve-Path "installer\MobileResearchSetup.exe").Path
          $process = Start-Process -FilePath $installer -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/SP-",
            "/DIR=$installDir"
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }

          $installedExe = Join-Path $installDir "MobileResearch.exe"
          if (-not (Test-Path $installedExe)) { throw "Installed executable not found" }

          $process = Start-Process -FilePath $installedExe -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installed self-test failed: $($process.ExitCode)" }

          $env:QT_QPA_PLATFORM = "offscreen"
          $process = Start-Process -FilePath $installedExe -ArgumentList "--gui-smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installed GUI smoke-test failed: $($process.ExitCode)" }

      - name: Hash installer
        shell: pwsh
        run: |
          $hash = (Get-FileHash installer\MobileResearchSetup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  MobileResearchSetup.exe" | Set-Content installer\SHA256SUMS.txt -Encoding ascii
          Get-Content installer\SHA256SUMS.txt

      - name: Detect release candidate
        id: release_candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $currentText = Get-Content pyproject.toml -Raw
          if ($currentText -notmatch '(?m)^version\s*=\s*"([^"]+)"') {
            throw "Current version not found"
          }
          $currentVersion = $Matches[1]

          $previousVersion = ""
          try {
            $previousText = git show "$env:GITHUB_SHA^:pyproject.toml"
            if ($LASTEXITCODE -eq 0 -and $previousText -match '(?m)^version\s*=\s*"([^"]+)"') {
              $previousVersion = $Matches[1]
            }
          } catch {
            $previousVersion = ""
          }

          $changed = ($previousVersion -eq "" -or $currentVersion -ne $previousVersion)
          "changed=$($changed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "current_version=$currentVersion" >> $env:GITHUB_OUTPUT
          Write-Host "Previous version: $previousVersion"
          Write-Host "Current version:  $currentVersion"
          Write-Host "Release candidate: $changed"

      - name: Upload temporary release installer
        if: steps.release_candidate.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-research-windows-desktop
          retention-days: 1
          path: |
            installer/MobileResearchSetup.exe
            installer/SHA256SUMS.txt

  windows-provisioning-acceptance:
    needs: build-windows-desktop
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Mobile Research core
        run: python -m pip install -e .

      - name: Show free disk space
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize

      - name: Provision managed Android on clean Windows
        shell: pwsh
        run: |
          $acceptanceRoot = Join-Path $env:RUNNER_TEMP "MobileResearchProvisioning"
          $componentRoot = Join-Path $acceptanceRoot "components"
          $resultPath = Join-Path $acceptanceRoot "result.json"

          New-Item -ItemType Directory -Force $acceptanceRoot | Out-Null

          $env:MOBILE_RESEARCH_COMPONENT_ROOT = $componentRoot
          $env:MOBILE_RESEARCH_ACCEPTANCE_ROOT = $acceptanceRoot
          $env:MOBILE_RESEARCH_ACCEPTANCE_RESULT = $resultPath

          python -c "from mobile_research.desktop.provisioning_acceptance import run_provisioning_acceptance; raise SystemExit(run_provisioning_acceptance())"
          if (Test-Path $resultPath) {
            Get-Content $resultPath
          }

      - name: Upload Windows provisioning diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-research-windows-provisioning-failure
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/MobileResearchProvisioning/result.json
            ${{ runner.temp }}/MobileResearchProvisioning/components/components.json
