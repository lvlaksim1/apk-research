name: Desktop Build

on:
  push:
    paths:
      - "src/mobile_research/**"
      - "packaging/**"
      - "pyproject.toml"
      - "tests/**"
      - ".github/workflows/desktop-build.yml"
  pull_request:
    paths:
      - "src/mobile_research/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/desktop-build.yml"

permissions:
  contents: read

jobs:
  build-windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -e ".[dev,desktop,build]"
      - name: Run tests
        run: python -m pytest -q
      - name: Build standalone desktop application
        run: python -m PyInstaller --noconfirm --clean packaging/MobileResearch.spec
      - name: Standalone self-test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist\MobileResearch\MobileResearch.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Standalone self-test failed: $($process.ExitCode)" }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer | Out-Null
          $text = Get-Content pyproject.toml -Raw
          if ($text -notmatch '(?m)^version\s*=\s*"([^"]+)"') { throw "Version not found" }
          $version = $Matches[1]
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" packaging\mobile-research.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Hash installer
        shell: pwsh
        run: |
          $hash = (Get-FileHash installer\MobileResearchSetup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  MobileResearchSetup.exe" | Set-Content installer\SHA256SUMS.txt -Encoding ascii
          Get-Content installer\SHA256SUMS.txt
      - name: Upload Windows desktop build
        uses: actions/upload-artifact@v4
        with:
          name: mobile-research-windows-desktop
          retention-days: 7
          path: |
            installer/MobileResearchSetup.exe
            installer/SHA256SUMS.txt
