name: Desktop Build
run-name: "Desktop Build • ${{ github.event.pull_request.title || github.event.head_commit.message || github.ref_name }}"

on:
  workflow_call:
    inputs:
      release_candidate:
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - "src/apk_research/**"
      - "packaging/**"
      - "pyproject.toml"
      - "tests/**"
      - "tools/check_desktop_android_components.py"
      - ".github/workflows/desktop-build.yml"
      - ".github/workflows/windows-whpx-acceptance.yml"

permissions:
  contents: read

jobs:
  build-windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -e ".[dev,desktop,build]"

      - name: Run tests
        run: python -m pytest -q

      - name: Resolve live Android component catalog
        run: python tools/check_desktop_android_components.py

      - name: Build standalone desktop application
        run: python -m PyInstaller --noconfirm --clean packaging/apk-research.spec

      - name: Standalone self-test
        shell: pwsh
        run: |
          $exe = "dist\apk-research\apk-research.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Standalone self-test failed: $($process.ExitCode)" }

      - name: Standalone GUI smoke-test
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $exe = "dist\apk-research\apk-research.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--gui-smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Standalone GUI smoke-test failed: $($process.ExitCode)" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer | Out-Null
          $text = Get-Content pyproject.toml -Raw
          if ($text -notmatch '(?m)^version\s*=\s*"([^"]+)"') { throw "Version not found" }
          $version = $Matches[1]
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" packaging\apk-research.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install built package and smoke-test installed app
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "apk-research-installed"
          $text = Get-Content pyproject.toml -Raw
          if ($text -notmatch '(?m)^version\s*=\s*"([^"]+)"') { throw "Version not found" }
          $version = $Matches[1]
          $installer = (Resolve-Path "installer\apk-research-setup_v$version.exe").Path
          $process = Start-Process -FilePath $installer -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/SP-",
            "/DIR=$installDir"
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }

          $installedExe = Join-Path $installDir "apk-research.exe"
          if (-not (Test-Path $installedExe)) { throw "Installed executable not found" }

          $process = Start-Process -FilePath $installedExe -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installed self-test failed: $($process.ExitCode)" }

          $env:QT_QPA_PLATFORM = "offscreen"
          $process = Start-Process -FilePath $installedExe -ArgumentList "--gui-smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installed GUI smoke-test failed: $($process.ExitCode)" }

      - name: Hash installer
        shell: pwsh
        run: |
          $text = Get-Content pyproject.toml -Raw
          if ($text -notmatch '(?m)^version\s*=\s*"([^"]+)"') { throw "Version not found" }
          $version = $Matches[1]
          $installerName = "apk-research-setup_v$version.exe"
          $installer = Join-Path "installer" $installerName
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          "$hash  $installerName" | Set-Content installer\SHA256SUMS.txt -Encoding ascii
          Get-Content installer\SHA256SUMS.txt

      - name: Upload temporary release installer
        if: inputs.release_candidate == true
        uses: actions/upload-artifact@v4
        with:
          name: apk-research-windows-desktop
          retention-days: 1
          path: |
            installer/apk-research-setup_v*.exe
            installer/SHA256SUMS.txt

  windows-provisioning-acceptance:
    needs: build-windows-desktop
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install apk-research core
        run: python -m pip install -e .

      - name: Show free disk space
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize

      - name: Provision managed Android on clean Windows
        shell: pwsh
        run: |
          $acceptanceRoot = Join-Path $env:RUNNER_TEMP "apk-research-provisioning"
          $componentRoot = Join-Path $acceptanceRoot "components"
          $resultPath = Join-Path $acceptanceRoot "result.json"

          New-Item -ItemType Directory -Force $acceptanceRoot | Out-Null

          $env:APK_RESEARCH_COMPONENT_ROOT = $componentRoot
          $env:APK_RESEARCH_ACCEPTANCE_ROOT = $acceptanceRoot
          $env:APK_RESEARCH_ACCEPTANCE_RESULT = $resultPath

          python -c "from apk_research.desktop.provisioning_acceptance import run_provisioning_acceptance; raise SystemExit(run_provisioning_acceptance())"
          if (Test-Path $resultPath) {
            Get-Content $resultPath
          }

      - name: Upload Windows provisioning diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apk-research-windows-provisioning-failure
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/apk-research-provisioning/result.json
            ${{ runner.temp }}/apk-research-provisioning/components/components.json
