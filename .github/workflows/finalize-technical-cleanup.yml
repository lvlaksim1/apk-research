name: Finalize Technical Cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/finalize-technical-cleanup.yml"

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Prepare final technical cleanup release'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final cleanup and release metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          version = "0.8.8"

          runtime_path = Path("src/mobile_research/desktop/android_runtime.py")
          runtime = runtime_path.read_text(encoding="utf-8")
          emulator_pid_block = '''    @property
          def emulator_pid(self) -> int:
              with self._process_lock:
                  process = self.process
              if (
                  process is None
                  or process.poll() is not None
              ):
                  return 0
              return int(process.pid)

          '''
          if emulator_pid_block not in runtime:
              raise SystemExit("emulator_pid cleanup target not found")
          runtime = runtime.replace(emulator_pid_block, "", 1)
          runtime_path.write_text(runtime, encoding="utf-8")

          main_path = Path("src/mobile_research/desktop/main_window.py")
          main = main_path.read_text(encoding="utf-8")
          if '        self._last_gpu_mode = ""\n' not in main:
              raise SystemExit("_last_gpu_mode init target not found")
          main = main.replace('        self._last_gpu_mode = ""\n', "", 1)
          assignment = '''            self._last_gpu_mode = str(
              gpu_mode or ""
          )
          '''
          if assignment not in main:
              raise SystemExit("_last_gpu_mode assignment target not found")
          main = main.replace(assignment, "", 1)
          main_path.write_text(main, encoding="utf-8")

          components_path = Path("src/mobile_research/desktop/components.py")
          components = components_path.read_text(encoding="utf-8")
          components = components.replace(
              "from xml.etree import ElementTree\n",
              "",
              1,
          )
          parser_start = components.index("def _local_name(")
          manager_start = components.index("class ComponentManager:")
          selector = '''def select_archive_from_repository_xml(
              xml_bytes: bytes,
              package_path: str,
              *,
              host_os: str = "windows",
              base_url: str = ANDROID_REPOSITORY_BASE,
          ) -> ArchiveInfo:
              """Select the newest stable archive for the requested host."""

              from mobile_research.desktop.repository_policy import (
                  select_stable_archive,
              )

              return select_stable_archive(
                  xml_bytes,
                  package_path,
                  host_os=host_os,
                  base_url=base_url,
              )


          '''
          components = (
              components[:parser_start]
              + selector
              + components[manager_start:]
          )
          components_path.write_text(components, encoding="utf-8")

          Path("src/mobile_research/desktop/__init__.py").write_text(
              '"""Desktop application layer for Mobile Research."""\n',
              encoding="utf-8",
          )

          contract_path = Path("tests/test_runtime_cleanup_contract.py")
          contract = contract_path.read_text(encoding="utf-8")
          extra = '''\n\ndef test_legacy_cleanup_shims_stay_removed() -> None:\n    runtime = _read("src/mobile_research/desktop/android_runtime.py")\n    main_window = _read("src/mobile_research/desktop/main_window.py")\n    desktop_init = _read("src/mobile_research/desktop/__init__.py")\n    components = _read("src/mobile_research/desktop/components.py")\n\n    assert "def emulator_pid(" not in runtime\n    assert "_last_gpu_mode" not in main_window\n    assert "select_archive_from_repository_xml =" not in desktop_init\n    assert "def _local_name(" not in components\n    assert "def _child_text(" not in components\n    assert "select_stable_archive" in components\n'''
          if "test_legacy_cleanup_shims_stay_removed" not in contract:
              contract += extra
          contract_path.write_text(contract, encoding="utf-8")

          pyproject = Path("pyproject.toml")
          text = pyproject.read_text(encoding="utf-8")
          text = text.replace('version = "0.8.7"', f'version = "{version}"', 1)
          pyproject.write_text(text, encoding="utf-8")

          init_path = Path("src/mobile_research/__init__.py")
          text = init_path.read_text(encoding="utf-8")
          text = text.replace(
              '__version__ = "0.8.7"',
              f'__version__ = "{version}"',
              1,
          )
          init_path.write_text(text, encoding="utf-8")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          section = '''## v0.8.8 — Final technical cleanup\n\nФинальный cleanup стабильного v0.8.7 runtime без изменения пользовательского поведения. Удалены подтверждённо мёртвые desktop state/helpers, package-level monkeypatch выбора Android repository archive заменён прямым стабильным policy-вызовом, а regression contract теперь запрещает возврат удалённых DWM/native/fallback путей и ручных workflow triggers. Рабочая цепочка hidden Emulator → gRPC/MMAP → AndroidView и persistent streamInputEvent не изменена.\n\n'''
          marker = "# Mobile Research\n\n"
          if section not in text:
              text = text.replace(marker, marker + section, 1)
          readme.write_text(text, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          section = '''## [0.8.8] - 2026-09-15\n\n### Final technical cleanup\n\n- Preserves the real-PC validated v0.8.7 runtime and research behavior.\n- Removes unused AndroidView pointer state and dead DesktopController helpers.\n- Removes the now-unused Emulator PID compatibility property and stale GUI GPU-cache field left from the former alternate display paths.\n- Replaces the package-import monkeypatch for Android repository selection with a direct stable-policy delegation while preserving the public selector API.\n- Removes the duplicate legacy XML archive parser helpers from `components.py`.\n- Adds a source-level cleanup contract preventing DWM/native/ADB-display fallbacks, dead helpers and manual `workflow_dispatch` from returning unnoticed.\n- Audits the active lifecycle as `startup cleanup → hidden Emulator → gRPC/MMAP → Android boot/root → first-frame gate → APK → research → stop/export`; no alternate display/input branch remains.\n- Historical release information remains in this changelog; active documentation is synchronized to the single required runtime.\n\n'''
          marker = "All notable Mobile Research changes are recorded here.\n\n"
          if section not in text:
              text = text.replace(marker, marker + section, 1)
          changelog.write_text(text, encoding="utf-8")

          refactoring = Path("REFACTORING.md")
          text = refactoring.read_text(encoding="utf-8")
          text = re.sub(
              r"\*\*Этап:\*\* v0\.8\.7[^\n]*",
              "**Этап:** v0.8.8 — final technical cleanup of the validated single-path runtime.",
              text,
              count=1,
          )
          adr = '''\n\n### ADR-085 — После v0.8.8 runtime cleanup считается завершённым\nРеальный Windows-тест v0.8.7 подтвердил полную готовность среды: embedded Android загрузился, обязательный gRPC/MMAP framebuffer работал, Root/PCAP/APK readiness завершились успешно. Финальный cleanup v0.8.8 не меняет эту цепочку. Удалены только доказанно мёртвые поля/helpers и исторический package-level monkeypatch repository policy. Добавлен source-level regression contract, который запрещает возврат DWM/native display, ADB screencap/input fallback, graphics profile ladder и manual workflow triggers. Дальнейшие изменения runtime допустимы только для конкретной воспроизводимой проблемы; следующий продуктовый этап — User Actions + Research Timeline.\n'''
          if "### ADR-085" not in text:
              text = text.rstrip() + adr + "\n"
          refactoring.write_text(text, encoding="utf-8")

          desktop_doc = Path("docs/V0.2_DESKTOP.md")
          text = desktop_doc.read_text(encoding="utf-8")
          text = text.replace(
              "v0.8.6 делает именно этот механизм единственным поддерживаемым пользовательским runtime.",
              "v0.8.8 сохраняет именно этот механизм как единственный поддерживаемый пользовательский runtime; technical cleanup этого слоя завершён.",
          )
          desktop_doc.write_text(text, encoding="utf-8")

          release_notes = Path("RELEASE_NOTES.md")
          release_notes.write_text('''# Mobile Research v0.8.8\n\nv0.8.8 завершает technical cleanup runtime-слоя после успешного реального теста v0.8.7.\n\n## Что подтверждено реальным тестом\n\n- Android Emulator загружается внутри Mobile Research;\n- отдельное окно Emulator не используется;\n- gRPC/MMAP framebuffer работает штатно;\n- Root, PCAP и APK readiness завершаются успешно;\n- текущая display/input architecture не требует compatibility fallback.\n\n## Cleanup\n\n- удалено неиспользуемое pointer-state поле из `AndroidView`;\n- удалены мёртвые `DesktopController.session_root` и `_thread_quiet`;\n- удалены неиспользуемые `AndroidRuntime.emulator_pid` и GUI `_last_gpu_mode`;\n- убран package-level monkeypatch Android repository selector;\n- `components.py` теперь напрямую делегирует выбор архива единой stable repository policy;\n- удалён дублирующий старый XML parser;\n- добавлен regression contract, запрещающий возврат DWM/native/ADB-display fallback и `workflow_dispatch`.\n\n## Runtime contract не изменён\n\nWindows: `-qt-hide-window → Emulator gRPC → MMAP → AndroidView`.\n\nInput: `AndroidView → persistent gRPC streamInputEvent → Android`.\n\nPrivate-AVD stale-process cleanup и один `-wipe-data` при guest boot stall остаются recovery того же runtime, а не альтернативными режимами.\n\nПосле этого релиза runtime technical cleanup считается завершённым. Следующий этап разработки — User Actions + Research Timeline.\n''', encoding="utf-8")

          workflow = Path(".github/workflows/finalize-technical-cleanup.yml")
          workflow.unlink()
          PY

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Mobile Research v0.8.8"
          git push origin HEAD:main
