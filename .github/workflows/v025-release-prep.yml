name: Temporary v0.25 release prep

on:
  push:
    branches:
      - feature/v0.25-transport-protocol-analysis

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.25-transport-protocol-analysis
          fetch-depth: 1

      - name: Prepare release documentation and acceptance
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"patch target not found: {label}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          readme = Path("README.md")
          readme_section = '''## v0.25.0 — Transport and Protocol Analysis

v0.25.0 расширяет Packet Inspector анализом транспортного уровня и наблюдаемых протоколов поверх уже существующего авторитетного `traffic.pcap`. Для выбранного TCP-потока теперь отдельно показываются наличие начала/окончания соединения в захвате, наблюдаемые диапазоны sequence, значения ACK и окна, повторы/перекрытия диапазонов и разрывы наблюдаемой последовательности.

DNS разбирается до вопросов и поддерживаемых ресурсных записей; TLS — только до реально наблюдаемых ClientHello/ServerHello, SNI, ALPN, версии и набора/выбранного шифра; существующий QUIC Initial-анализ объединён в тот же отчёт, а HTTP/3 заявляется только при реально наблюдаемом `h3` в ALPN. Открытый HTTP разбирается только когда полные заголовки присутствуют в захваченных байтах.

Смысл доказательств остаётся консервативным: разрыв sequence не равен доказанной потере пакета, повтор диапазона не равен автоматически доказанной сетевой повторной передаче, отсутствие SYN/FIN/RST означает только «не наблюдалось в этом захвате». Зашифрованные прикладные данные не выдаются за открытый текст; `causal_claim=false`; RAW PCAP остаётся авторитетным. Подробный контракт: `docs/V0.25_TRANSPORT_PROTOCOL_ANALYSIS.md`.

'''
          replace_once(
              readme,
              "# apk-research\n\n",
              "# apk-research\n\n" + readme_section,
              "README v0.25 section",
          )

          changelog = Path("CHANGELOG.md")
          changelog_section = '''## [0.25.0] - 2026-10-07

### Transport and Protocol Analysis

- Adds capture-bounded TCP sequence/ACK/window observations, including explicit missing-start/missing-end semantics.
- Flags repeated and overlapping observed sequence ranges, observed sequence gaps, repeated ACK values and zero-window packets without automatically converting them into packet-loss/retransmission claims.
- Adds structured DNS message decoding and only groups a query/response pair when the selected flow contains one unambiguous matching transaction.
- Adds observed TLS ClientHello/ServerHello metadata and bounded contiguous TCP-payload analysis without plaintext synthesis.
- Aggregates existing QUIC Initial/SNI/ALPN evidence into the selected-flow report and reports HTTP/3 only from observed `h3` ALPN.
- Adds cleartext HTTP/1.x and h2c evidence only when complete captured bytes support it; ambiguous request/response pairing is not synthesized.
- Integrates the report into Packet Inspector search, packet details and a dedicated flow-analysis pane.
- Extends real-AVD acceptance to require the v0.25 evidence contract on the generated Research ZIP.
- Preserves RAW PCAP authority, Packet ↔ Action temporal-only semantics, `causal_claim=false`, v0.10.5 startup sequencing and the hidden Emulator → gRPC/MMAP runtime.

'''
          replace_once(
              changelog,
              "# Changelog\n\n",
              "# Changelog\n\n" + changelog_section,
              "CHANGELOG v0.25 section",
          )

          refactoring = Path("REFACTORING.md")
          architecture_section = '''## v0.25.0 — Transport and Protocol Analysis

### Evidence model

v0.25 remains a derived analysis layer over the authoritative raw PCAP. It introduces no stronger causal model and no replacement evidence artifact. The selected-flow report declares `evidence_basis=captured-packets-only` and `causal_claim=false`.

### TCP observation boundary

Sequence ranges, ACK values and advertised windows are analyzed in capture order. Repeated/overlapping sequence ranges and gaps are observations about captured sequence space only. They are deliberately not promoted into definitive packet-loss or retransmission claims because capture loss, out-of-order delivery and an already-active connection can produce similar observations. Missing SYN/FIN/RST is represented as possible missing capture start/end, never as proof of non-occurrence.

### Protocol boundary

DNS is decoded only from complete captured messages. TLS metadata is decoded only from complete records/hellos available per packet or from bounded contiguous observed TCP payload. QUIC reuses the existing authenticated Initial parser; HTTP/3 is derived only from observed ALPN. Cleartext HTTP grouping is deliberately narrow and emitted only for one unambiguous complete request/response pair in opposite directions.

### Compatibility boundary

RAW PCAP authority, Packet ↔ Action temporal-only correlation, v0.10.5 startup/clean-launch sequencing and hidden Emulator → gRPC/MMAP → AndroidView remain unchanged. Audio Evidence and user-facing Virtual Display remain out of scope.

'''
          replace_once(
              refactoring,
              "# Refactoring and Architecture Log\n\n",
              "# Refactoring and Architecture Log\n\n" + architecture_section,
              "REFACTORING v0.25 section",
          )

          acceptance = Path("tools/acceptance_avd.py")
          acceptance_old = '''        packet_report = inspect_archive_flow(
            Path(result.archive),
            inspected_flow,
        )
        if packet_report.get("artifact") != RAW_PCAP_ARTIFACT:
'''
          acceptance_new = '''        packet_report = inspect_archive_flow(
            Path(result.archive),
            inspected_flow,
        )
        protocol_analysis = packet_report.get("protocol_analysis")
        if not isinstance(protocol_analysis, dict):
            raise RuntimeError(
                "Packet Inspector v0.25 protocol analysis is missing"
            )
        if protocol_analysis.get("schema_version") != "0.1":
            raise RuntimeError(
                "Packet Inspector v0.25 protocol analysis schema is invalid"
            )
        if protocol_analysis.get("evidence_basis") != "captured-packets-only":
            raise RuntimeError(
                "Packet Inspector v0.25 evidence basis is invalid"
            )
        if protocol_analysis.get("causal_claim") is not False:
            raise RuntimeError(
                "Packet Inspector v0.25 must not claim causality"
            )
        analyzed_transport = protocol_analysis.get("transport") or {}
        if (
            str(inspected_flow.get("protocol") or "").lower() == "tcp"
            and analyzed_transport.get("applicable") is not True
        ):
            raise RuntimeError(
                "Packet Inspector v0.25 TCP analysis is not applicable to a TCP flow"
            )
        if packet_report.get("artifact") != RAW_PCAP_ARTIFACT:
'''
          replace_once(
              acceptance,
              acceptance_old,
              acceptance_new,
              "AVD v0.25 acceptance",
          )

          inspector = Path("src/apk_research/desktop/packet_inspector.py")
          replace_once(
              inspector,
              '            "v0.25 protocol observations:",\n',
              '            "Наблюдения протоколов v0.25:",\n',
              "packet detail Russian heading",
          )

          protocol = Path("src/apk_research/desktop/protocol_analysis_v025.py")
          text = protocol.read_text(encoding="utf-8")
          substitutions = {
              'lines.append("v0.25 TCP observations: " + ", ".join(flags))': 'lines.append("Наблюдения TCP v0.25: " + ", ".join(flags))',
              'f"Cleartext HTTP request: {http.get(\'method\') or \'—\'} {http.get(\'target\') or \'—\'}; host={http.get(\'host\') or \'—\'}"': 'f"Открытый HTTP-запрос: {http.get(\'method\') or \'—\'} {http.get(\'target\') or \'—\'}; узел={http.get(\'host\') or \'—\'}"',
              'f"Cleartext HTTP response: {http.get(\'status\') or \'—\'} {http.get(\'reason\') or \'\'}".rstrip()': 'f"Открытый HTTP-ответ: {http.get(\'status\') or \'—\'} {http.get(\'reason\') or \'\'}".rstrip()',
              'lines.append("Cleartext HTTP/2 connection preface observed")': 'lines.append("Обнаружена открытая префиксная последовательность HTTP/2")',
              '        "QUIC/HTTP3: "\n        f"observed={bool(quic.get(\'observed\'))}; "\n        f"versions={\',\'.join(str(value) for value in quic.get(\'versions\') or []) or \'—\'}; "\n        f"ALPN={\',\'.join(str(value) for value in quic.get(\'alpn\') or []) or \'—\'}; "\n        f"HTTP3={bool(quic.get(\'http3_observed_via_alpn\'))}; application payload encrypted"': '        "QUIC/HTTP3: "\n        f"наблюдался={bool(quic.get(\'observed\'))}; "\n        f"версии={\',\'.join(str(value) for value in quic.get(\'versions\') or []) or \'—\'}; "\n        f"ALPN={\',\'.join(str(value) for value in quic.get(\'alpn\') or []) or \'—\'}; "\n        f"HTTP3={bool(quic.get(\'http3_observed_via_alpn\'))}; прикладная нагрузка зашифрована"',
          }
          for old, new in substitutions.items():
              if old not in text:
                  raise SystemExit("protocol presentation patch target not found")
              text = text.replace(old, new, 1)
          protocol.write_text(text, encoding="utf-8", newline="\n")

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check -q -e '.[dev]'

      - name: Compile source and tests
        run: python -m compileall -q src tests tools

      - name: Run v0.25 and Packet Inspector tests
        run: python -m pytest -q tests/test_protocol_analysis_v025.py tests/test_packet_inspector_v025_integration.py tests/test_packet_inspector.py

      - name: Verify release documentation contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'v0.25.0' README.md
          grep -F 'v0.25.0' REFACTORING.md
          grep -F '[0.25.0]' CHANGELOG.md
          grep -F 'v0.25.0' RELEASE_NOTES.md
          grep -F '__version__ = "0.25.0"' src/apk_research/__init__.py

      - name: Commit verified release preparation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md REFACTORING.md tools/acceptance_avd.py src/apk_research/desktop/packet_inspector.py src/apk_research/desktop/protocol_analysis_v025.py
          git diff --cached --quiet && exit 0
          git commit -m "v0.25: document and verify release evidence contract"
          git push origin HEAD:feature/v0.25-transport-protocol-analysis
