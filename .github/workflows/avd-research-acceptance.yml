name: AVD Research Acceptance

on:
  push:
    branches:
      - main
    paths:
      - "src/mobile_research/**"
      - "tools/acceptance_avd.py"
      - ".github/workflows/avd-research-acceptance.yml"

permissions:
  contents: read

jobs:
  avd-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ANDROID_AVD_HOME: ${{ github.workspace }}/.android/avd

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Mobile Research
        run: python -m pip install -e ".[dev]"

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "system-images;android-35;default;x86_64"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"

      - name: Check KVM
        shell: bash
        run: |
          set -euxo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check

      - name: Create AVD-RESEARCH
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$ANDROID_AVD_HOME"
          AVDMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name avdmanager | sort | tail -n 1)"
          test -n "$AVDMANAGER"
          echo no | "$AVDMANAGER" create avd --force --name mobile_research_api35 --package "system-images;android-35;default;x86_64"
          "$ANDROID_HOME/emulator/emulator" -list-avds
          find "$ANDROID_AVD_HOME" -maxdepth 2 -type f -print

      - name: Start AVD-RESEARCH
        shell: bash
        run: |
          set -euxo pipefail
          nohup "$ANDROID_HOME/emulator/emulator"             @mobile_research_api35             -port 5554             -no-window             -gpu swiftshader_indirect             -no-snapshot             -noaudio             -no-boot-anim             -wipe-data             > emulator.log 2>&1 &
          echo $! > emulator.pid

          sleep 5
          if ! kill -0 "$(cat emulator.pid)" 2>/dev/null; then
            echo "Android Emulator exited before ADB became available."
            cat emulator.log
            exit 1
          fi

          if ! timeout 120 adb wait-for-device; then
            echo "ADB did not detect the emulator within 120 seconds."
            cat emulator.log
            adb devices -l || true
            exit 1
          fi

          if ! timeout 300 bash -c 'until [ "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'; then
            echo "Android did not report sys.boot_completed=1."
            cat emulator.log
            adb devices -l || true
            exit 1
          fi

          ROOT_READY=0
          for attempt in 1 2 3 4 5; do
            CURRENT_UID="$(adb -s emulator-5554 shell id -u 2>/dev/null | tr -d "\r" || true)"
            if [ "$CURRENT_UID" = "0" ]; then
              ROOT_READY=1
              break
            fi

            echo "adb root attempt $attempt"
            adb -s emulator-5554 root || true
            sleep 3
            timeout 30 adb -s emulator-5554 wait-for-device || true
          done

          if [ "$ROOT_READY" != "1" ]; then
            if timeout 60 bash -c 'until [ "$(adb -s emulator-5554 shell id -u 2>/dev/null | tr -d "\r")" = "0" ]; do sleep 2; done'; then
              ROOT_READY=1
            fi
          fi

          if [ "$ROOT_READY" != "1" ]; then
            echo "ADB root did not become available."
            adb devices -l || true
            adb -s emulator-5554 shell id || true
            cat emulator.log
            exit 1
          fi

          adb -s emulator-5554 shell getprop ro.build.version.release
          adb -s emulator-5554 shell getprop ro.build.fingerprint
          adb -s emulator-5554 shell id
          adb -s emulator-5554 shell 'tcpdump --version || /system/bin/tcpdump --version || /system/xbin/tcpdump --version || /data/local/tmp/tcpdump --version'

      - name: Run real AVD acceptance
        run: python tools/acceptance_avd.py

      - name: Verify generated Research ZIP again
        run: python -m mobile_research research-zip-verify acceptance-output/mobile-research-acceptance.research.zip --json

      - name: Stop emulator
        if: always()
        shell: bash
        run: |
          adb -s emulator-5554 emu kill || true
          if [ -f emulator.pid ]; then
            kill "$(cat emulator.pid)" || true
          fi

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avd-research-acceptance
          if-no-files-found: warn
          retention-days: 7
          path: |
            emulator.log
            acceptance-output/**
