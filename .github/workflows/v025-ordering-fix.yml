name: Temporary v0.25 ordering fix

on:
  push:
    branches:
      - feature/v0.25-transport-protocol-analysis

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.25-transport-protocol-analysis
          fetch-depth: 1
      - name: Apply conservative capture-order fix
        run: python tools/v025_ordering_patch.py
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -q -e '.[dev]'
      - name: Compile affected source and tests
        run: python -m compileall -q src tests
      - name: Run protocol pairing regressions and focused suite
        run: python -m pytest -q tests/test_protocol_pairing_v025.py tests/test_protocol_analysis_v025.py tests/test_packet_inspector_v025_integration.py tests/test_packet_inspector.py
      - name: Commit verified ordering fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/apk_research/desktop/protocol_analysis_v025.py
          git diff --cached --quiet && exit 0
          git commit -m "v0.25: require capture order for protocol pairing"
          git push origin HEAD:feature/v0.25-transport-protocol-analysis
