name: Windows Stable Emulator Probe

on:
  push:
    branches:
      - fix-stable-android-channel
    paths:
      - ".github/workflows/windows-stable-emulator-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stable-emulator:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install stable emulator and API 35 image
        shell: pwsh
        run: |
          sdkmanager "platform-tools" "emulator" "system-images;android-35;default;x86_64"
          emulator -version
          sdkmanager --list_installed

      - name: Create AVD
        shell: cmd
        run: |
          echo no | avdmanager create avd --force --name mobile_research_api35 --package "system-images;android-35;default;x86_64"
          emulator -list-avds

      - name: Start stable emulator without acceleration
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "emulator" -ArgumentList @(
            "@mobile_research_api35",
            "-port", "5554",
            "-no-window",
            "-gpu", "swiftshader",
            "-accel", "off",
            "-no-snapshot",
            "-noaudio",
            "-no-boot-anim",
            "-wipe-data"
          ) -RedirectStandardOutput "emulator.log" -RedirectStandardError "emulator-error.log" -PassThru
          $process.Id | Set-Content emulator.pid

          $deadline = (Get-Date).AddMinutes(15)
          $booted = $false
          while ((Get-Date) -lt $deadline) {
            if ($process.HasExited) {
              Write-Host "Emulator exited with code $($process.ExitCode)"
              Get-Content emulator.log -ErrorAction SilentlyContinue
              Get-Content emulator-error.log -ErrorAction SilentlyContinue
              exit 1
            }

            $state = adb -s emulator-5554 get-state 2>$null
            if ($state -eq "device") {
              $done = adb -s emulator-5554 shell getprop sys.boot_completed 2>$null
              if (($done | Out-String).Trim() -eq "1") {
                $booted = $true
                break
              }
            }
            Start-Sleep -Seconds 3
          }

          if (-not $booted) {
            Write-Host "Emulator did not complete boot"
            adb devices -l
            Get-Content emulator.log -ErrorAction SilentlyContinue
            Get-Content emulator-error.log -ErrorAction SilentlyContinue
            exit 1
          }

          adb -s emulator-5554 root
          Start-Sleep -Seconds 3
          adb -s emulator-5554 wait-for-device
          adb -s emulator-5554 shell id
          adb -s emulator-5554 shell getprop ro.build.fingerprint

      - name: Stop emulator
        if: always()
        shell: pwsh
        run: |
          adb -s emulator-5554 emu kill 2>$null
          if (Test-Path emulator.pid) {
            $pidValue = Get-Content emulator.pid
            Stop-Process -Id $pidValue -Force -ErrorAction SilentlyContinue
          }

      - name: Upload emulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-stable-emulator-probe
          if-no-files-found: warn
          retention-days: 7
          path: |
            emulator.log
            emulator-error.log
