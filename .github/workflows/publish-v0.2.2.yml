name: Publish v0.2.2

on:
  push:
    paths:
      - ".github/workflows/publish-v0.2.2.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: 2a731ec023f5b1b08dcc44b314897bb154920e4b
      DESKTOP_RUN_ID: "34860461189"
      RELEASE_TAG: v0.2.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify exact tested Desktop Build
        shell: bash
        run: |
          set -euo pipefail
          RUN_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DESKTOP_RUN_ID")"
          test "$(jq -r '.name' <<<"$RUN_JSON")" = "Desktop Build"
          test "$(jq -r '.head_sha' <<<"$RUN_JSON")" = "$RELEASE_SHA"
          test "$(jq -r '.status' <<<"$RUN_JSON")" = "completed"
          test "$(jq -r '.conclusion' <<<"$RUN_JSON")" = "success"

      - name: Verify exact-SHA CI and real Android acceptance
        shell: bash
        run: |
          set -euo pipefail
          RUNS="$(gh run list --commit "$RELEASE_SHA" --limit 30 --json workflowName,status,conclusion,headSha)"
          for NAME in "CI" "AVD Research Acceptance" "Desktop Build"; do
            STATE="$(jq -r --arg name "$NAME" '[.[] | select(.workflowName == $name and .headSha == env.RELEASE_SHA)][0] | if . == null then "missing" else (.status + ":" + (.conclusion // "")) end' <<<"$RUNS")"
            echo "$NAME=$STATE"
            test "$STATE" = "completed:success"
          done

      - name: Download exact tested installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh run download "$DESKTOP_RUN_ID" -n mobile-research-windows-desktop -D release-assets
          test -f release-assets/MobileResearchSetup.exe
          test -f release-assets/SHA256SUMS.txt

      - name: Verify installer checksum
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum -c SHA256SUMS.txt

      - name: Read exact release notes
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/contents/RELEASE_NOTES.md?ref=$RELEASE_SHA" --jq '.content' | base64 -d > release-notes.md
          grep -F "# Mobile Research v0.2.2" release-notes.md

      - name: Publish GitHub Release v0.2.2
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG"
            exit 0
          fi
          gh release create "$RELEASE_TAG"             release-assets/MobileResearchSetup.exe             release-assets/SHA256SUMS.txt             --target "$RELEASE_SHA"             --title "Mobile Research v0.2.2"             --notes-file release-notes.md             --latest
