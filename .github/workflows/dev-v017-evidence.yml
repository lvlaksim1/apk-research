name: v0.17 Evidence Explorer verification

on:
  push:
    branches:
      - dev-v017-evidence-explorer-final

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[desktop]" pytest
      - name: Compile
        run: python -m compileall -q src tests
      - name: Tests
        run: python -m pytest -q
      - name: GUI construction smoke
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          @'
          from PySide6.QtWidgets import QApplication
          from apk_research.desktop.evidence_navigation_window import UnifiedEvidenceMainWindow
          app = QApplication([])
          window = UnifiedEvidenceMainWindow()
          assert window.tabs.count() >= 6
          assert window.tabs.tabText(window.evidence_tab_index) == "Evidence"
          window.close()
          print("Evidence Explorer GUI smoke OK")
          '@ | python -
