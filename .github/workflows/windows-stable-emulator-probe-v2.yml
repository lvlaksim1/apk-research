name: Windows Stable Emulator Probe v2

on:
  push:
    branches:
      - fix-stable-android-channel
    paths:
      - ".github/workflows/windows-stable-emulator-probe-v2.yml"

permissions:
  contents: read

jobs:
  stable-emulator:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install stable emulator and API 35 image
        shell: pwsh
        run: |
          sdkmanager "platform-tools" "emulator" "system-images;android-35;default;x86_64"

          $emulator = Join-Path $env:ANDROID_SDK_ROOT "emulator\emulator.exe"
          $adb = Join-Path $env:ANDROID_SDK_ROOT "platform-tools\adb.exe"
          $avdmanager = Get-ChildItem (Join-Path $env:ANDROID_SDK_ROOT "cmdline-tools") -Recurse -Filter "avdmanager.bat" |
            Sort-Object FullName |
            Select-Object -Last 1 -ExpandProperty FullName

          if (-not (Test-Path $emulator)) { throw "emulator.exe not found: $emulator" }
          if (-not (Test-Path $adb)) { throw "adb.exe not found: $adb" }
          if (-not $avdmanager) { throw "avdmanager.bat not found" }

          "EMULATOR_EXE=$emulator" >> $env:GITHUB_ENV
          "ADB_EXE=$adb" >> $env:GITHUB_ENV
          "AVDMANAGER_EXE=$avdmanager" >> $env:GITHUB_ENV

          & $emulator -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          sdkmanager --list_installed

      - name: Create AVD
        shell: pwsh
        run: |
          "no" | & $env:AVDMANAGER_EXE create avd --force --name mobile_research_api35 --package "system-images;android-35;default;x86_64"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:EMULATOR_EXE -list-avds

      - name: Start stable emulator without acceleration
        shell: pwsh
        run: |
          $process = Start-Process -FilePath $env:EMULATOR_EXE -ArgumentList @(
            "@mobile_research_api35",
            "-port", "5554",
            "-no-window",
            "-gpu", "swiftshader",
            "-accel", "off",
            "-no-snapshot",
            "-noaudio",
            "-no-boot-anim",
            "-wipe-data"
          ) -RedirectStandardOutput "emulator.log" -RedirectStandardError "emulator-error.log" -PassThru

          $process.Id | Set-Content emulator.pid
          $deadline = (Get-Date).AddMinutes(15)
          $booted = $false

          while ((Get-Date) -lt $deadline) {
            if ($process.HasExited) {
              Write-Host "Emulator exited with code $($process.ExitCode)"
              Get-Content emulator.log -ErrorAction SilentlyContinue
              Get-Content emulator-error.log -ErrorAction SilentlyContinue
              exit 1
            }

            $state = & $env:ADB_EXE -s emulator-5554 get-state 2>$null
            if (($state | Out-String).Trim() -eq "device") {
              $done = & $env:ADB_EXE -s emulator-5554 shell getprop sys.boot_completed 2>$null
              if (($done | Out-String).Trim() -eq "1") {
                $booted = $true
                break
              }
            }
            Start-Sleep -Seconds 3
          }

          if (-not $booted) {
            Write-Host "Emulator did not complete boot"
            & $env:ADB_EXE devices -l
            Get-Content emulator.log -ErrorAction SilentlyContinue
            Get-Content emulator-error.log -ErrorAction SilentlyContinue
            exit 1
          }

          & $env:ADB_EXE -s emulator-5554 root
          Start-Sleep -Seconds 3
          & $env:ADB_EXE -s emulator-5554 wait-for-device
          & $env:ADB_EXE -s emulator-5554 shell id
          & $env:ADB_EXE -s emulator-5554 shell getprop ro.build.fingerprint

      - name: Stop emulator
        if: always()
        shell: pwsh
        run: |
          if ($env:ADB_EXE -and (Test-Path $env:ADB_EXE)) {
            & $env:ADB_EXE -s emulator-5554 emu kill 2>$null
          }
          if (Test-Path emulator.pid) {
            $pidValue = Get-Content emulator.pid
            Stop-Process -Id $pidValue -Force -ErrorAction SilentlyContinue
          }
          exit 0

      - name: Upload emulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-stable-emulator-probe-v2
          if-no-files-found: warn
          retention-days: 7
          path: |
            emulator.log
            emulator-error.log
