name: apk-research rename audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-to-apk-research.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify old product identity is absent
        shell: bash
        run: |
          set -euo pipefail
          AUDIT_FILE='.github/workflows/rename-to-apk-research.yml'
          MATCHES="$(git grep -n -I -E 'Mobile Research|MobileResearch|mobile-research|mobile_research|MOBILE_RESEARCH' -- . ':!'"$AUDIT_FILE" || true)"
          if [[ -n "$MATCHES" ]]; then
            printf '%s\n' "$MATCHES"
            echo 'Old product identity remains in tracked files.'
            exit 1
          fi
          test -d src/apk_research
          test -f packaging/apk-research.spec
          test -f packaging/apk-research.iss
          grep -F 'name = "apk-research"' pyproject.toml
          grep -F 'apk-research = "apk_research.cli:main"' pyproject.toml
          echo 'apk-research rename audit passed.'
