name: One-shot apk-research rename

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-to-apk-research.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run complete product rename
        run: python tools/one_shot_rename_to_apk_research.py
