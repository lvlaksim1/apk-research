name: Release

on:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "src/mobile_research/__init__.py"
      - "CHANGELOG.md"
      - "RELEASE_NOTES.md"
      - ".github/workflows/release.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python - <<'PY'
          import pathlib
          import tomllib
          print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *".dev"* ]] || [[ "$VERSION" == *"+"* ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "Development version $VERSION: publication skipped."
          else
            echo "stable=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify release documentation
        if: steps.version.outputs.stable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          grep -F "v$VERSION" README.md
          grep -F "v$VERSION" REFACTORING.md
          grep -F "[$VERSION]" CHANGELOG.md
          grep -F "v$VERSION" RELEASE_NOTES.md
          grep -F "__version__ = \"$VERSION\"" src/mobile_research/__init__.py
      - name: Wait for exact-SHA gates
        if: steps.version.outputs.stable == 'true'
        id: gates
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 660); do
            RUNS="$(gh run list --commit "$GITHUB_SHA" --limit 30 --json databaseId,workflowName,status,conclusion)"
            ALL_OK=true
            DESKTOP_RUN_ID=""
            for NAME in "CI" "AVD Research Acceptance" "Desktop Build" "Windows WHPX Acceptance"; do
              STATE="$(jq -r --arg name "$NAME" '[.[] | select(.workflowName == $name)][0] | if . == null then "missing" else (.status + ":" + (.conclusion // "")) end' <<<"$RUNS")"
              echo "$NAME=$STATE"
              if [[ "$STATE" == completed:* && "$STATE" != completed:success ]]; then
                echo "Gate failed: $NAME=$STATE"
                exit 1
              fi
              if [[ "$STATE" != completed:success ]]; then ALL_OK=false; fi
            done
            if [[ "$ALL_OK" == true ]]; then
              DESKTOP_RUN_ID="$(jq -r '[.[] | select(.workflowName == "Desktop Build")][0].databaseId' <<<"$RUNS")"
              echo "desktop_run_id=$DESKTOP_RUN_ID" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for exact-SHA gates"
          exit 1
      - name: Ensure tag is not already published
        if: steps.version.outputs.stable == 'true'
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists: $TAG"
            exit 1
          fi
      - name: Download tested Windows installer
        if: steps.version.outputs.stable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh run download "${{ steps.gates.outputs.desktop_run_id }}" -n mobile-research-windows-desktop -D release-assets
          ls -l release-assets
          test -f release-assets/MobileResearchSetup.exe
          test -f release-assets/SHA256SUMS.txt
      - name: Verify installer checksum
        if: steps.version.outputs.stable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum -c SHA256SUMS.txt
      - name: Publish GitHub Release
        if: steps.version.outputs.stable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          gh release create "$TAG" release-assets/MobileResearchSetup.exe release-assets/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Mobile Research $TAG" --notes-file RELEASE_NOTES.md
