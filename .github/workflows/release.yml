name: Release
run-name: "Publish Release • ${{ github.event.head_commit.message || github.ref_name }}"

on:
  workflow_call:

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python - <<'PY'
          import pathlib
          import tomllib
          print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *".dev"* ]] || [[ "$VERSION" == *"+"* ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "Development version $VERSION: publication skipped."
          else
            echo "stable=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify release documentation
        if: steps.version.outputs.stable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          grep -F "v$VERSION" README.md
          grep -F "v$VERSION" REFACTORING.md
          grep -F "[$VERSION]" CHANGELOG.md
          grep -F "v$VERSION" RELEASE_NOTES.md
          grep -F "__version__ = \"$VERSION\"" src/apk_research/__init__.py

      - name: Ensure tag is not already published
        if: steps.version.outputs.stable == 'true'
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists: $TAG"
            exit 1
          fi
      - name: Download tested Windows installer
        if: steps.version.outputs.stable == 'true'
        uses: actions/download-artifact@v4
        with:
          name: apk-research-windows-desktop
          path: release-assets

      - name: Verify installer checksum
        if: steps.version.outputs.stable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          VERSION="${{ steps.version.outputs.version }}"
          test -f "apk-research-setup_v${VERSION}.exe"
          sha256sum -c SHA256SUMS.txt
      - name: Publish GitHub Release
        if: steps.version.outputs.stable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          INSTALLER="apk-research-setup_v${VERSION}.exe"
          gh release create "$TAG" "release-assets/$INSTALLER" release-assets/SHA256SUMS.txt --target "$GITHUB_SHA" --title "apk-research $TAG" --notes-file RELEASE_NOTES.md

      - name: Delete temporary installer artifact
        if: steps.version.outputs.stable == 'true' && success()
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "apk-research-windows-desktop") | .id' | head -n 1)"
          if [[ -n "$ARTIFACT_ID" ]]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
            echo "Deleted temporary installer artifact $ARTIFACT_ID"
          else
            echo "Temporary installer artifact already absent"
          fi
