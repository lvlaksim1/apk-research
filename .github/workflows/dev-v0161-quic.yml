name: v0.16.1 QUIC regression verification

on:
  push:
    branches:
      - fix-v0161-quic-classifier

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[desktop]" pytest
      - name: Compile
        run: python -m compileall -q src tests
      - name: Test
        run: python -m pytest -q
