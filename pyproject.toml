[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apk-research"
version = "0.14.0"
description = "Self-contained Windows desktop environment for reproducible Android application research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
apk-research = "apk_research.cli:main"
apk-research-gui = "apk_research.desktop_entry:main"

[project.optional-dependencies]
desktop = [
    "PySide6-Essentials>=6.8,<7",
    "grpcio>=1.66,<2",
    "protobuf>=5.27,<7",
]
transport = [
    "grpcio>=1.66,<2",
    "protobuf>=5.27,<7",
]
build = [
    "PyInstaller>=6.10,<7",
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
